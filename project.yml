name: Grasp
options:
  bundleIdPrefix: com.grasp
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Grasp:
    type: application
    platform: macOS
    sources: [{ path: Grasp, excludes: ["Resources/Inter.ttc", "Services/Secrets.example.swift"] }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grasp.app
        INFOPLIST_FILE: Grasp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Grasp/Grasp.entitlements
    dependencies: [{ sdk: libsqlite3.tbd }]
    preBuildScripts:
      - name: Copy Inter Font
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/Grasp/Resources/Inter.ttc" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
