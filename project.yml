name: Grasp
options:
  bundleIdPrefix: com.grasp
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Grasp:
    type: application
    platform: macOS
    sources: [{ path: Grasp, excludes: ["Resources"] }]
    resources: [{ path: Grasp/Resources, type: folder }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grasp.app
        INFOPLIST_FILE: Grasp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Grasp/Grasp.entitlements
    dependencies: [{ sdk: libsqlite3.tbd }]
